<section class="vida-pantalla" aria-labelledby="vida-titulo">
  <div class="vida-tarjeta">
    <div class="vida-icono" aria-hidden="true">✓</div>

    <p class="vida-etiqueta">Seguro de Accidentes +Vida</p>

    <h1 id="vida-titulo">
      Usted ya cuenta con el seguro +Vida
    </h1>

    <p class="vida-mensaje">
      Si desea modificar la distribución o registrar nuevos
      beneficiarios, puede realizar la actualización en línea.
    </p>

    <div class="vida-acciones">
      <button
        type="button"
        class="vida-boton"
        (click)="iniciarActualizacionBeneficiarios()">
        Actualizar beneficiarios
      </button>

      <button
        type="button"
        class="vida-boton vida-boton-secundario"
        (click)="irAlEnlaceSomos()">
        Volver al inicio
      </button>
    </div>
  </div>
</section>
